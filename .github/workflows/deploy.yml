# Deploys the site to Cloudflare Pages (lifestories.org.nz) on every push to main.
# Needs one repo secret: CLOUDFLARE_API_TOKEN (Cloudflare API token with "Cloudflare Pages: Edit").
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 72f3e7b31fe3b7ee6f1e677ae2225bad
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PROJECT_NAME: lifestories

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html *.css *.svg *.xml images audio _site/
          rm -f _site/audio/.keep

      - name: Create Pages project (first run only)
        run: npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main || true

      - name: Deploy
        run: npx --yes wrangler@4 pages deploy _site --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
